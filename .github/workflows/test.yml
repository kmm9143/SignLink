name: CI - Run Tests

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///./test.db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SignLink.API/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest SignLink.API/tests/test_us1_translate_image.py -v --cov=. --cov-report=xml --cov-report=term-missing
          pytest SignLink.API/tests/test_us2_translate_video.py -v --cov=. --cov-report=xml --cov-report=term-missing