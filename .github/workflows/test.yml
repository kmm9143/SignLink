name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SignLink.API/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # -----------------------------
      # Create a fresh SQLite test DB if not exists
      # -----------------------------
      - name: Ensure test database exists
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          cd SignLink.API
          python - <<EOF
  from database import engine
  from models.base import Base
  from models.user_information import UserInformation
  from models.user_settings import UserSettings
  from models.user_translation_history import UserTranslationHistory

  Base.metadata.create_all(bind=engine)
EOF

      # -----------------------------
      # Seed test user (only if not exists)
      # -----------------------------
      - name: Seed test user
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          cd SignLink.API
          python - <<EOF
  from database import get_db
  from models.user_information import UserInformation

  db = next(get_db())
  user = db.query(UserInformation).filter_by(USER_ID=1).first()
  if not user:
      db.add(UserInformation(
          USER_ID=1,
          USERNAME='testuser',
          EMAIL='test@example.com',
          PASSWORD='testpass'
      ))
      db.commit()
  db.close()
EOF

      # -----------------------------
      # Run all tests with coverage
      # -----------------------------
      - name: Run all tests with coverage
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          cd SignLink.API
          pytest tests/ --cov=. --cov-append --cov-report=term-missing --cov-report=xml

      # -----------------------------
      # Upload coverage report
      # -----------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml