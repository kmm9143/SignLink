name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SignLink.API/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # -----------------------------
      # NEW: Initialize database
      # -----------------------------
      - name: Initialize test database
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          python -c "from database import engine; from models.base import Base; Base.metadata.create_all(bind=engine)"

      - name: Run all tests with coverage
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          pytest SignLink.API/tests/ --cov=. --cov-append --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml