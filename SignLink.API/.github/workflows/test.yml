name: CI - Run Tests

# 🔹 Trigger workflow on push or pull request to main or any branch
on:
  push:
    branches:
      - main
      - '**'       # any branch
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/test_us1_translate_image.py -v --cov=. --cov-report=xml --cov-report=term-missing